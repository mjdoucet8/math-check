<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#245b65" /><title>Numora · The quiet harbour</title></head>
<body>
<main class="game-shell" aria-label="Numora island adventure">
  <div id="game" aria-label="Isometric harbour. Click or tap the ground to walk."></div>
  <div id="world-ui">
    <header class="masthead"><div class="wordmark">Numora <span>✧</span></div><div class="header-controls"><span class="badge">THE SLEEPING ISLAND</span><button id="pause" disabled aria-pressed="false">Pause</button></div></header>
    <section class="goal"><span class="eyebrow">YOUR FIRST STEPS</span><h1 id="goal-text">Meet the harbour keeper</h1><p id="goal-hint">Select a person or the light to walk over and take a look.</p></section>
    <aside class="place"><span id="place-number" class="place-number">01</span><div><span id="place-name">THE QUIET HARBOUR</span><small id="place-line">A light waiting to awaken.</small></div></aside>
    <footer class="controls"><p id="status" role="status">Preparing the harbour…</p><button id="reset" disabled>Start again</button></footer>
    <section id="dialogue" class="dialogue" aria-label="Conversation" aria-live="polite" hidden><div><span id="speaker" class="eyebrow"></span><p id="speech"></p></div><button id="close-dialogue" aria-label="Close conversation">×</button></section>
  </div>
  <div id="challenge-panel" class="challenge-panel" hidden><section id="challenge-content" role="dialog" aria-modal="true" aria-labelledby="challenge-title"></section></div>
  <div id="vessel-panel" class="challenge-panel" hidden><section id="vessel-content" role="dialog" aria-modal="true" aria-labelledby="vessel-title"></section></div>
  <div id="reward-panel" class="challenge-panel" hidden><section id="reward-content" role="dialog" aria-modal="true" aria-labelledby="reward-title"></section></div>
  <div id="pause-panel" class="pause-panel" hidden><section role="dialog" aria-modal="true" aria-labelledby="pause-title"><span class="eyebrow">TAKE YOUR TIME</span><h2 id="pause-title">The harbour can wait.</h2><button id="resume">Continue exploring</button></section></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body></html>
